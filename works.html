<script>
document.addEventListener("DOMContentLoaded", function () {
  const header = document.querySelector("[data-header]");
  const menu = document.getElementById("globalNavigation");
  const toggler = document.querySelector(".navbar-toggler");
  if (menu && toggler) {
    const setMenuState = function (isOpen) {
      document.body.classList.toggle("menu-open", isOpen);
      toggler.setAttribute("aria-expanded", String(isOpen));
    };
    menu.addEventListener("show.bs.collapse", function () { setMenuState(true); });
    menu.addEventListener("hidden.bs.collapse", function () { setMenuState(false); });
    menu.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        const instance = bootstrap.Collapse.getOrCreateInstance(menu, { toggle: false });
        instance.hide();
      });
    });
    window.addEventListener("resize", function () {
      if (window.innerWidth >= 992 && menu.classList.contains("show")) {
        bootstrap.Collapse.getOrCreateInstance(menu, { toggle: false }).hide();
      }
    });
  }
  if (header) {
    const updateHeader = function () { header.classList.toggle("is-scrolled", window.scrollY > 24); };
    updateHeader();
    window.addEventListener("scroll", updateHeader, { passive: true });
  }
  const year = document.getElementById('currentYear');
  if (year) year.textContent = new Date().getFullYear();
});
</script></body></html>
