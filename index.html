<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="SSKSは、AI・Web・EC・業務改善を組み合わせ、中小企業のAI活用を伴走支援します。福岡県を拠点に九州全域への訪問と全国オンライン対応を行っています。"
  >

  <title>SSKS｜AI Strategy Partner</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container">

        <a
          class="navbar-brand"
          href="./"
          aria-label="SSKS トップページ"
        >
          <img
            class="header-logo"
            src="./assets/img/logo.png"
            alt="SSKS AI Strategy Partner"
            width="190"
            height="61"
          >
        </a>

        <button
          class="navbar-toggler border-0 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#globalNavigation"
          aria-controls="globalNavigation"
          aria-expanded="false"
          aria-label="メニューを開閉する"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse"
          id="globalNavigation"
        >
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="#challenges">
                お悩み
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#services">
                サービス
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#about">
                SSKSについて
              </a>
            </li>

            <li class="nav-item ms-lg-3">
              <a class="btn btn-brand header-cta" href="#contact">
                無料相談する
              </a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>


  <main>

    <!-- First View -->
    <section class="hero">
      <div class="container">
        <div class="row align-items-center g-5">

          <div class="col-lg-6">
            <div class="hero-content">

              <p class="brand-name mb-2">
                SSKS
              </p>

              <p class="hero-category mb-4">
                AI × Web × EC × Automation
              </p>

              <h1 class="hero-title">
                AIを、もっと人のために。
              </h1>

              <p class="hero-intro">
                AIを導入するだけでは、会社は変わりません。
              </p>

              <p class="hero-description">
                Web制作・EC運営・生成AI。<br class="d-none d-sm-inline">
                現場を知るWebディレクターだからできる、
                成果につながるAI活用を伴走支援します。
              </p>

              <div class="hero-buttons">
                <a class="btn btn-brand btn-lg" href="#contact">
                  無料相談する
                </a>

                <a class="btn btn-outline-brand btn-lg" href="#services">
                  サービスを見る
                  <span aria-hidden="true">→</span>
                </a>
              </div>

            </div>
          </div>

          <div class="col-lg-6">
            <div class="hero-image-wrap">
              <img
                class="hero-image"
                src="./assets/img/hero-image.jpg"
                alt="AIとデータネットワークをイメージしたビジュアル"
                width="760"
                height="620"
              >
            </div>
          </div>

        </div>
      </div>
    </section>


    <!-- Area Features -->
    <section
      class="area-features"
      aria-label="対応エリア"
    >
      <div class="container">
        <div class="row g-0">

          <div class="col-md-4">
            <div class="area-feature">
              <span class="area-feature-icon" aria-hidden="true">
                ●
              </span>

              <span class="area-feature-text">
                福岡県を拠点
              </span>
            </div>
          </div>

          <div class="col-md-4">
            <div class="area-feature">
              <span class="area-feature-icon" aria-hidden="true">
                ●
              </span>

              <span class="area-feature-text">
                九州全域訪問対応
              </span>
            </div>
          </div>

          <div class="col-md-4">
            <div class="area-feature">
              <span class="area-feature-icon" aria-hidden="true">
                ●
              </span>

              <span class="area-feature-text">
                オンライン全国対応
              </span>
            </div>
          </div>

        </div>
      </div>
    </section>


    <!-- 次回以降の仮セクション -->
    <section id="challenges" class="temporary-section">
      <div class="container text-center">
        <p class="section-label">YOUR CHALLENGES</p>
        <h2>こんなお悩みありませんか</h2>
        <p>次の工程で実装します。</p>
      </div>
    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>

  <script src="./assets/js/main.js"></script>
</body>
</html>
